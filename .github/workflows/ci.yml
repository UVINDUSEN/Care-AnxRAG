name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run test suite
        run: pytest -q

      - name: Run deterministic offline self-check
        env:
          CARE_VECTOR_BACKEND: sqlite
          CARE_EMBEDDING_PROVIDER: hash
          CARE_GENERATOR_PROVIDER: rule
          CARE_RERANKER_PROVIDER: heuristic
          CARE_NLI_PROVIDER: heuristic
          CARE_ALLOW_NETWORK_SYNC: "false"
          CARE_HOME: /tmp/care-ci
        run: care-anxrag selfcheck --offline --project-root .
