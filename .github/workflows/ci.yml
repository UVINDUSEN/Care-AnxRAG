name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts/offline_acceptance.py
      - name: Test and coverage
        run: |
          coverage run --source=care_anxrag -m pytest -q
          coverage report --fail-under=70
      - name: Offline acceptance
        run: python scripts/offline_acceptance.py --project-root .
      - name: Build distributions
        run: python -m build
